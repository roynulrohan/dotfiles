# kitty, shared by every machine. Colours come from colors.conf next to this file:
#   Linux: caelestia's last scheme, a fallback; live colours come from
#          themes/noctalia.conf, written by a Noctalia template (globinclude below)
#   macOS: mac/kitty/colors.conf from this repo
# Per-machine tweaks (font size, opacity) go in local.conf, which is not committed.
shell fish
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
window_padding_width 25
background_opacity 0.78
dynamic_background_opacity yes
confirm_os_window_close 0
# Don't restore the last window's size or maximised state. Hyprland and AeroSpace
# tile kitty, and a restored "maximized" makes every new kitty open maximised.
remember_window_size no
enable_audio_bell no
scrollback_lines 10000
# Only show the scrollbar while the mouse is at the window's right edge. The
# default ("scrolled") shows it whenever the view isn't at the bottom, which a
# window resize can leave behind.
scrollbar hovered
# Handle and track in the theme's dark selection colour (Noctalia's palette,
# themes/noctalia.conf), dimmed; fully round (radius = half the hover width,
# which is the width it always has in "hovered" mode).
scrollbar_handle_color selection_background
scrollbar_handle_opacity 0.8
scrollbar_track_color selection_background
scrollbar_track_hover_opacity 0.25
scrollbar_radius 0.5
cursor_shape beam
cursor_beam_thickness 1.5
allow_remote_control socket-only
# Abstract socket, Linux only. mac/kitty/macos.conf switches the Mac to a path.
listen_on unix:@kitty

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Jump between prompts (starship/fish emit OSC 133 markers)
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

include colors.conf
# Per-OS overrides: ${KITTY_OS} is linux or macos. globinclude, not include, so
# an OS without its file loads nothing instead of logging an error.
globinclude ${KITTY_OS}.conf
# Noctalia's wallpaper palette on Linux (written by a Noctalia template); the Mac
# has no such file, so globinclude loads nothing there.
globinclude themes/noctalia.conf
include local.conf
