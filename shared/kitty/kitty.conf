# kitty, shared by every machine. Colours come from colors.conf next to this file:
#   Linux: generated from caelestia's scheme (live colours arrive via escape
#          sequences printed by fish, so this is only a fallback)
#   macOS: mac/kitty/colors.conf from this repo
# Per-machine tweaks (font size, opacity) go in local.conf, which is not committed.
shell fish
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
window_padding_width 25
background_opacity 0.78
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000
cursor_shape beam
cursor_beam_thickness 1.5
allow_remote_control socket-only
# Abstract (@) sockets are Linux-only; a path works on both OSes, kitty appends -PID.
listen_on unix:/tmp/kitty

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Jump between prompts (starship/fish emit OSC 133 markers)
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

include colors.conf
include local.conf
