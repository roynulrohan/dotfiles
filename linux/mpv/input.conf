# Image-viewer bindings. The {image} section is active only while an image is
# open (mpv.conf's [image] profile switches it on); there wheel, arrows, n/p
# and the keys below act on the image. Videos keep mpv's defaults (wheel =
# volume, arrows = seek) plus the zoom and pan keys at the end of this file.

# Mouse
WHEEL_UP      {image} script-binding positioning/cursor-centric-zoom  0.05 # zoom in towards the cursor
WHEEL_DOWN    {image} script-binding positioning/cursor-centric-zoom -0.05 # zoom out towards the cursor
MBTN_LEFT     {image} script-binding positioning/drag-to-pan              # drag to pan
MBTN_LEFT_DBL {image} ignore                                              # no fullscreen by accident while dragging
MBTN_MID      {image} script-binding positioning/align-to-cursor          # hold to sweep across the whole image

# Next / previous image in the folder (hold to flip through)
n     {image} repeatable playlist-next
p     {image} repeatable playlist-prev
PGDWN {image} repeatable playlist-next
PGUP  {image} repeatable playlist-prev

# Pan: arrows move 10% of the window per press, Alt+arrows 1%
LEFT      {image} script-binding positioning/pan-x -0.1
RIGHT     {image} script-binding positioning/pan-x  0.1
UP        {image} script-binding positioning/pan-y -0.1
DOWN      {image} script-binding positioning/pan-y  0.1
Alt+LEFT  {image} script-binding positioning/pan-x -0.01
Alt+RIGHT {image} script-binding positioning/pan-x  0.01
Alt+UP    {image} script-binding positioning/pan-y -0.01
Alt+DOWN  {image} script-binding positioning/pan-y  0.01

# Zoom, fit and rotate
= {image} add video-zoom  0.1
- {image} add video-zoom -0.1
Alt+= {image} add video-zoom  0.01 # fine zoom in
Alt+- {image} add video-zoom -0.01 # fine zoom out
0 {image} no-osd set video-zoom 0; no-osd set panscan 0; no-osd set video-align-x 0; no-osd set video-align-y 0 # reset the view
u {image} no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0 # actual pixels / fit to window
r {image} cycle-values video-rotate 270 180 90 0 # rotate counterclockwise
t {image} cycle-values video-rotate 90 180 270 0 # rotate clockwise

# Videos (and anything else outside the {image} section): the same zoom keys
# as images. Plain arrows stay seek, so panning takes Ctrl: Ctrl+arrows move
# 10% of the window, Ctrl+Alt+arrows 1% (Alt = fine, as everywhere). Ctrl+Left
# and Ctrl+Right were subtitle seek. Alt+Backspace resets zoom and pan (mpv's
# default; 0 is volume in videos).
=              add video-zoom  0.1
-              add video-zoom -0.1
Alt+=          add video-zoom  0.01 # fine zoom in
Alt+-          add video-zoom -0.01 # fine zoom out
Ctrl+LEFT      script-binding positioning/pan-x -0.1
Ctrl+RIGHT     script-binding positioning/pan-x  0.1
Ctrl+UP        script-binding positioning/pan-y -0.1
Ctrl+DOWN      script-binding positioning/pan-y  0.1
Ctrl+Alt+LEFT  script-binding positioning/pan-x -0.01
Ctrl+Alt+RIGHT script-binding positioning/pan-x  0.01
Ctrl+Alt+UP    script-binding positioning/pan-y -0.01
Ctrl+Alt+DOWN  script-binding positioning/pan-y  0.01
