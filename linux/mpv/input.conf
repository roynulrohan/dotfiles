# Image-viewer bindings. The {image} section is active only while an image is
# open (mpv.conf's [image] profile switches it on), so videos keep mpv's
# defaults: wheel = volume, arrows = seek, < and > = previous/next file.

# Mouse
WHEEL_UP      {image} script-binding positioning/cursor-centric-zoom  0.1 # zoom in towards the cursor
WHEEL_DOWN    {image} script-binding positioning/cursor-centric-zoom -0.1 # zoom out towards the cursor
MBTN_LEFT     {image} script-binding positioning/drag-to-pan              # drag to pan
MBTN_LEFT_DBL {image} ignore                                              # no fullscreen by accident while dragging
MBTN_MID      {image} script-binding positioning/align-to-cursor          # hold to sweep across the whole image

# Next / previous image in the folder (hold to flip through)
RIGHT {image} repeatable playlist-next
LEFT  {image} repeatable playlist-prev
n     {image} repeatable playlist-next
p     {image} repeatable playlist-prev
PGDWN {image} repeatable playlist-next
PGUP  {image} repeatable playlist-prev

# Pan: Up/Down, or Shift+arrows in any direction (Left/Right switch images)
UP          {image} script-binding positioning/pan-y -0.1
DOWN        {image} script-binding positioning/pan-y  0.1
Shift+LEFT  {image} script-binding positioning/pan-x -0.1
Shift+RIGHT {image} script-binding positioning/pan-x  0.1
Shift+UP    {image} script-binding positioning/pan-y -0.1
Shift+DOWN  {image} script-binding positioning/pan-y  0.1

# Zoom, fit and rotate
= {image} add video-zoom  0.1
- {image} add video-zoom -0.1
0 {image} no-osd set video-zoom 0; no-osd set panscan 0; no-osd set video-align-x 0; no-osd set video-align-y 0 # reset the view
u {image} no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0 # actual pixels / fit to window
r {image} cycle-values video-rotate 270 180 90 0 # rotate counterclockwise
t {image} cycle-values video-rotate 90 180 270 0 # rotate clockwise
