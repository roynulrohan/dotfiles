# Start every file at 30%, never above 100%
volume=30
volume-max=100

# Resume files where you stopped
save-position-on-quit

# Was already here before: loop a single file forever
loop-file=inf

# --- Image viewing ----------------------------------------------------------
# mpv is the default viewer for images and videos. Based on
# guidocella/mpv-image-config (by the author of mpv's built-in positioning
# script), trimmed to what needs no third-party scripts. The image-only key
# bindings are in input.conf.

# Opening a file loads the rest of its folder, same kind only (images with
# images, videos with videos).
autocreate-playlist=same
prefetch-playlist          # decode the next file before you get to it
image-display-duration=inf # keep images open (default: 5 seconds)
# Zoom, pan and rotation start fresh on every file.
reset-on-next-file=video-zoom,panscan,video-unscaled,video-align-x,video-align-y,video-rotate
auto-window-resize=no      # keep the window size when changing file
autofit-larger=90%x90%     # a big image or video opens within 90% of the screen

# Shown for 7 seconds when a file opens: [3/12] name 4032x3024
osd-playing-msg=${!playlist-count==1:[${playlist-pos-1}/${playlist-count}] }${media-title} ${?width:${width}x${height}} ${?current-tracks/video/image==no:${?percent-pos==0:${duration}}${!percent-pos==0:${time-pos} / ${duration} (${percent-pos}%)}}
osd-playing-msg-duration=7000

# Stand-alone images, not album art. The condition stays true across images,
# so the profile isn't restored and reapplied on every file.
[image]
profile-cond=(get('current-tracks/video/image') and not get('current-tracks/video/albumart')) or (not get('current-tracks/video') and get('user-data/mpv/image'))
profile-restore=copy
input-commands-append=no-osd set user-data/mpv/image 1; enable-section image allow-hide-cursor
osc=no                    # no on-screen controls, just the image
background-color=0.2      # dark grey instead of black behind the image
video-recenter            # recenter after zooming out
save-position-on-quit=no  # no resume files for images
stop-screensaver=no       # images stay open forever, so let the screen sleep

# Back to a video or audio file: switch the image bindings off again.
[non-image]
profile-cond=get('user-data/mpv/image') and (not get('current-tracks/video/image') or get('current-tracks/audio'))
input-commands=no-osd del user-data/mpv/image; disable-section image
