# thumbfast options that differ from its defaults (thumbfast.conf in
# po5/thumbfast, installed as /etc/mpv/script-opts/thumbfast.conf).

# mpv counts files on SMB shares (opened through kio-fuse) as network streams, and
# thumbfast skips network streams by default. Its thumbnailer reads at most
# 128 KiB ahead per seek.
network=yes
