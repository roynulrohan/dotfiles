# uosc options that differ from its defaults. The full list with defaults and
# documentation: src/uosc.conf in tomasklaen/uosc (also installed as
# /usr/share/mpv/script-opts/uosc.conf by mpv-uosc).

# No always-visible thin progress line; the timeline shows only on approach or
# with Tab (input.conf).
progress=never

# Neutral greys instead of pure white on black. Noctalia's palette changes with
# the wallpaper, so no accent colour is fixed here.
color=foreground=d8d8d8,foreground_text=161616,background=161616,background_text=d8d8d8,curtain=0e0e0e
