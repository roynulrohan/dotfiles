[General]
# The theme reads location.json with XHR and runs on X11 (x11.conf).
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QT_QPA_PLATFORM=xcb
# Empty: CachyOS's /usr/lib/sddm/sddm.conf.d/general.conf loads Qt's on-screen
# keyboard, which opens on the theme's password field.
InputMethod=

[Theme]
# Overrides CachyOS's Current=breeze in /usr/lib/sddm/sddm.conf.d/general.conf:
# files in /etc/sddm.conf.d win over /usr/lib/sddm/sddm.conf.d.
Current=noctalia-card
