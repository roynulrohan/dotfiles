# Noctalia Card: defaults. The colour lines are fallbacks; the synced colours
# come from theme.conf.user, which SDDM reads over this file.
[General]
# 12-hour clock with AM/PM, as on the lock screen [true | false]
ap=true

# Page 1, the greeting [true | false]; false starts on the login card
enableWelcomeMessage=true
# Page 1's frosted card: blur on/off, blur strength and tint opacity [0.0 to 1.0]
welcomeBgBlur=true
welcomeBgBlurAmount=0.7
welcomeColorOpacity=0.7

# Page 2's main card: blur strength and tint opacity [0.0 to 1.0]
mainCardBlurAmount=0.9
mainCardColorOpacity=0.9

# Play <assetsDir>/background.mp4 (or .webm/.mkv/.mov/.m4v/.avi) over the
# still; needs qt6-multimedia [true | false]
backgroundVideoEnabled=true

# Folder with the user files the sync copies: background (still),
# background.<video>, current.gif, location.json, faces/<user>.face.icon
assetsDir=/var/lib/sddm-assets

# Fallback colours. Noctalia writes the real ones to <assetsDir>/colours.conf,
# which theme.conf.user links to (../../SETUP.md, How it stays in sync).
background=#0d0e12
surface=#0d0e12
surfaceContainerHigh=#1d1f26
text=#e3e5f0
primary=#68779b
onPrimary=#314060
secondary=#bfc6dc
tertiary=#f0dfff
outline=#73757f
error=#fa746f
