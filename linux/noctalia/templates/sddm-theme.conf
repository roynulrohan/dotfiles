# Generated by Noctalia from ~/.config/noctalia/templates/sddm-theme.conf (caelestia's
# sddm-theme.conf user template on Noctalia's palette). sddm-sync copies it into
# the root-owned SDDM theme; run that by hand after a wallpaper change.
# ========================== CONFIG FOR LOCKLIKE =============================
[General]
#! SystemInfo (overriden by sync script ignore)
os=Arch
host=localhost

# ============================================================================
# Clock
# ============================================================================
# 12 hours or 24 Hours true=12 [true | false]
ap=false

# ============================================================================
# WELCOME MESSAGE
# ============================================================================
# Enable welcome message [true | false]
enableWelcomeMessage=true

# Welcome message background opacity [0.0 to 1.0]
welcomeBgBlurAmount=0.7
welcomeColorOpacity=0.7
# mainCard background opacity and blur [0.0 to 1.0]
mainCardBlurAmount=0.9
mainCardColorOpacity=0.9
mainCardComponentsOpacity=0.9
# Welcome message background blur [true | false]
welcomeBgBlur=true
mainCardBgBlur=true
sessionPicker=true

# ============================================================================
# BACKGROUND
# ============================================================================
# Video wallpaper playback (requires qt6-multimedia) [true | false]
# Place a video at assets/background.mp4 (or .webm/.mkv/.mov/.m4v/.avi)
backgroundVideoEnabled=true

# ============================================================================
# AVATAR
# ============================================================================
# Avatar shape [hexagon | circle]
# hexagon: hexagonal Material Design blob shape (default)
# circle: circular crop
AvatarShape=hexagon

# ============================================================================
# COLOR SCHEME
# ============================================================================
#! Do not touch these! (rendered by Noctalia)
background=#{{ colors.background.default.hex_stripped }}
mainCard=#{{ colors.background.default.hex_stripped }}
subComponents=#{{ colors.surface_container.default.hex_stripped }}
text=#{{ colors.on_surface.default.hex_stripped }}
textDark=#{{ colors.tertiary.default.hex_stripped }}
primary=#{{ palettes.primary.50.hex_stripped }}
onPrimary=#{{ colors.on_primary.default.hex_stripped }}
secondary=#{{ colors.secondary.default.hex_stripped }}
onSecondary=#{{ colors.on_secondary.default.hex_stripped }}
tertiary=#{{ colors.tertiary.default.hex_stripped }}
onTertiary=#{{ colors.on_tertiary.default.hex_stripped }}
onSuccess=#{{ colors.on_success.default.hex_stripped }}
inverseOnSurface=#{{ colors.inverse_on_surface.default.hex_stripped }}
surface=#{{ colors.surface.default.hex_stripped }}
surfaceVariant=#{{ colors.surface_variant.default.hex_stripped }}
surfaceContainerLow=#{{ colors.surface_container_low.default.hex_stripped }}
surfaceContainer=#{{ colors.surface_container.default.hex_stripped }}
surfaceContainerHigh=#{{ colors.surface_container_high.default.hex_stripped }}
outline=#{{ colors.outline.default.hex_stripped }}
error=#{{ colors.error.default.hex_stripped }}
