; Generated by Noctalia from ~/.config/noctalia/templates/spicetify.ini.
; caelestia's (GPL-3.0) Spotify colour scheme (spicetify-dark.ini) on Noctalia's palette.
; config-xpui.ini selects current_theme = noctalia, color_scheme = noctalia.
[noctalia]
text                = {{ colors.on_surface.default.hex_stripped }}                  ; Main text colour
subtext             = {{ colors.on_surface_variant.default.hex_stripped }}          ; Subtext colour
main                = {{ colors.surface_container.default.hex_stripped }}           ; Panel backgrounds
highlight           = {{ colors.primary.default.hex_stripped }}                     ; Doesn't seem to do anything
misc                = {{ colors.primary.default.hex_stripped }}                     ; Doesn't seem to do anything
notification        = {{ colors.outline.default.hex_stripped }}                     ; Notifications probably
notification-error  = {{ colors.error.default.hex_stripped }}                       ; Error notifications probably
shadow              = {{ colors.shadow.default.hex_stripped }}                      ; Shadow for covers, context menu, also affects playlist/artist banners
card                = {{ colors.surface_container_high.default.hex_stripped }}      ; Context menu and tooltips
player              = {{ colors.secondary_container.default.hex_stripped }}         ; Background for top result in search
sidebar             = {{ colors.surface.default.hex_stripped }}                     ; Background
main-elevated       = {{ colors.surface_container_high.default.hex_stripped }}      ; Higher layers than main, e.g. search bar
highlight-elevated  = {{ colors.surface_container_highest.default.hex_stripped }}   ; Home button and search bar accelerator
selected-row        = {{ colors.on_surface.default.hex_stripped }}                  ; Selections, hover, other coloured text and slider background
button              = {{ colors.primary.default.hex_stripped }}                     ; Slider and text buttons
button-active       = {{ colors.primary.default.hex_stripped }}                     ; Background buttons
button-disabled     = {{ colors.outline.default.hex_stripped }}                     ; Disabled buttons
tab-active          = {{ colors.surface_container_high.default.hex_stripped }}      ; Profile fallbacks in search
