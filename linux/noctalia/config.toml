# Keep the live wallpapers (linux-wallpaperengine): Noctalia draws its own
# wallpaper by default, which would cover them.
[wallpaper]
enabled = false

# Colours from the wallpaper. The scheme here is only the starting default:
# changing scheme or wallpaper in Noctalia's settings is saved in its own state
# (~/.local/state/noctalia/settings.toml), which wins over this file, and every
# template follows the live palette. Nothing in the repo needs to change.
[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

# Idle, carried over from caelestia: lock after 1 h, screens off after 1.5 h,
# lock and suspend after 4 h (plain suspend: zram swap only, so no hibernate).
[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
timeout = 3600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 5400
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 14400
action = "lock_and_suspend"
enabled = true

# Weather: Ottawa, named in full (plain "Ottawa" also matches US towns; with
# coordinates instead, the UI showed the numbers as the place name).
[location]
auto_locate = false
address = "Ottawa, Ontario, Canada"

# Session menu: the default five, but log out runs `uwsm stop`. Noctalia's own
# log out exits Hyprland directly, which once froze the SDDM login screen.
[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"
command = "uwsm stop"

[[shell.session.actions]]
action = "lock_and_suspend"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"

# --- Look: HyDE-style bar and islands (see SETUP.md, Bar) ---
[shell]
font_family = "JetBrainsMono Nerd Font"
# 12-hour time and a written-out date wherever Noctalia shows them without
# their own setting: control centre, calendar, lock screen.
time_format = "{:%-I:%M %p}"
date_format = "%A, %B %-d, %Y"

# HyDE-style: an invisible bar with separate rounded islands on it.
[bar.default]
margin_edge = 4              # 4 px from the screen top, the same as every gap
margin_ends = 0              # with padding 4, islands align with the windows' 4 px edge
concave_edge_corners = false # those only work on a bar attached to the edge
background_opacity = 0.0     # the bar itself is invisible; only the islands show
compositor_blur = false
shadow = false
thickness = 24               # = island height: no hidden space above or below the islands
padding = 4
widget_spacing = 16          # between islands: 2x the gap inside one
font_weight = 700
font_scale = 0.75             # Noctalia's bar text is 14 px; 0.75 gives ~10.5 px, HyDE's 10 px bold
capsule = true               # every widget and group sits in its own island
capsule_fill = "surface"
capsule_opacity = 0.8        # HyDE: islands slightly see-through; Hyprland blurs behind them
capsule_thickness = 1.0      # islands fill the bar, so screen→island = island→window = 4 px
capsule_padding = 8          # radius left automatic: a full pill
start = ["group:stats", "workspaces", "submap"]
center = ["workspace-apps"]
# Left = information, middle = apps, right = controls.
end = ["media", "group:signal", "group:modes", "updates", "tray", "clock", "group:system", "session"]

[[bar.default.capsule_group]]
id = "stats"                 # machine state, text only
members = ["cpu", "ram", "cputemp", "gputemp"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[[bar.default.capsule_group]]
id = "signal"                # is it working: online, sound
members = ["network", "volume"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[[bar.default.capsule_group]]
id = "modes"                 # how the PC behaves: stay awake, do not disturb (right-click the bell)
members = ["caffeine", "notifications"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[[bar.default.capsule_group]]
id = "system"                # customising and settings; power sits alone at the edge
members = ["wallpaper", "control-center"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"

[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"

[widget.cputemp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"

[widget.gputemp]
type = "sysmon"
stat = "gpu_temp"
visualization = "none"

# Community plugin k4n4t4/hypr-submap (enable: noctalia msg plugins enable
# k4n4t4/hypr-submap): shows the active Hyprland submap, e.g. "window" while
# window mode (Super+A) is on; hidden otherwise. Click it to leave the mode.
[widget.submap]
type = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true
glyph = "arrows-move"

# Our local copy of the community plugin yuuto/arch-updater
# (~/.local/share/noctalia/plugins/arch-updater, id roynul/arch-updater) with
# its panel floating, since attached panels go transparent on the invisible
# bar. Needs pacman-contrib. Pending pacman and AUR updates in the bar; click
# for a panel with both lists, Arch news warnings, a check button, update
# and rollback.
[widget.updates]
type = "roynul/arch-updater:widget"

# Check for updates every 4 hours (the plugin's default, 0, only checks on click).
[plugin_settings."roynul/arch-updater"]
auto_check_hours = 4

# Media island: "Title - Artist", album art a bit bigger than the default
# 16 px. No minimum width, so it hugs short titles; long ones stop at 240 px and
# scroll. Hidden when no player is running. (hide_when_idle, hiding it
# while paused, is in Noctalia's docs but not in 5.2.1.)
[widget.media]
title_scroll = "always"
art_size = 20
min_length = 0
max_length = 240
hide_when_no_media = true

# Control centre sidebar with icons and names, also when it opens on a tab.
[control_center]
sidebar = "full"
sidebar_section = "full"

[widget.network]
show_label = false           # icon only, no "enp5s0"

# HyDE-style workspaces: bare numbers on the island, the active one a wider
# filled pill. Inactive pills are transparent, so only their numbers show.
[widget.workspaces]
style = "regular"
label_source = "id"
hide_when_empty = true       # only workspaces with windows (plus the active one)
focused_color = "primary"
occupied_color = "#00000000"  # transparent: the number sits straight on the see-through island
empty_color = "#00000000"
active_pill_size = 2.2
font_scale = 1.3             # numbers start at 11 px and the bar scale (0.75) applies too: 11 × 0.75 × 1.3 ≈ 10.7 px
inactive_pill_size = 1.0
pill_scale = 1.0

# Our plugin (~/.local/share/noctalia/plugins/workspace-apps): the app icons on
# this monitor's current workspace. Replaces the built-in taskbar, which shows
# every window on a monitor whose workspace is empty (a Noctalia bug).
[widget.workspace-apps]
type = "roynul/workspace-apps:icons"

# Screenshots like caelestia: the region opens in an editor first. Enter or
# Done copies; Save writes a file; Esc discards. In the region overlay, the
# copy and save keys deliver at once, skipping the editor.
[shell.screenshot]
annotate = true
skip_annotate_on_copy_save = true
save_to_file = false
directory = "~/Pictures/Screenshots"   # Save puts them here, not loose in ~/Pictures
copy_to_clipboard = true

# Attached panels grow out of the bar and share its background; with an
# invisible bar they turned transparent. Float them, like the launcher.
[shell.panel]
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
# Open each panel under the island that was clicked, not at the bar's centre.
open_near_click_control_center = true
open_near_click_wallpaper = true
open_near_click_session = true
open_near_click_clipboard = true

# kitty takes its colours from Noctalia's palette. Our own copy of Noctalia's
# kitty template (templates/kitty.conf) writes only kitty/themes/noctalia.conf;
# the built-in one also edits kitty.conf, which is shared with the Mac.
[theme.templates]
builtin_ids = []

[theme.templates.user.kitty]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/kitty.conf"
output_path = "$XDG_CONFIG_HOME/kitty/themes/noctalia.conf"
post_hook = "pkill -USR1 -x kitty || true"

# Launcher actions, ported from caelestia's ">" actions: type /cmd to list them
# (they also show up when you search by name). Each line is title<TAB>description;
# `exec` gets the chosen line as {selection}.
[shell.launcher.dmenu.entry.actions]
label = "Actions"
prefix = "cmd"
glyph = "bolt"
global = true
command = """printf '%s\t%s\n' \
  'Restart audio' 'Fix sound after the headset reconnects (PipeWire, EQ)' \
  'Restart shell' 'Restart Noctalia (fixes bar and panel glitches)' \
  'Reload Hyprland' 'Re-read the Hyprland config; puts workspaces back on their monitors' \
  'Restart wallpapers' 'Restart the live wallpapers' \
  'Night light off' 'Turn the night light off until the next login' \
  'Night light on' 'Back to the configured warmth' \
  'Battery' 'Show the charge of wireless devices (mice, controllers)'"""
exec = '''case "{selection}" in
  "Restart audio"*) systemctl --user restart pipewire pipewire-pulse wireplumber filter-chain ;;
  "Restart shell"*) pkill -x noctalia; sleep .5; uwsm app -- noctalia ;;
  "Reload Hyprland"*) hyprctl reload ;;
  "Restart wallpapers"*) "$HOME/.local/bin/live-wallpaper" ;;
  "Night light off"*) hyprctl hyprsunset identity ;;
  "Night light on"*) hyprctl hyprsunset reset ;;
  "Battery"*) b=$(upower -d | awk '/^Device:/{m="";p="";s=""} /^ +model:/{sub(/^ +model: +/,"");sub(/^(Logitech|Sony Interactive Entertainment) /,"");sub(/ Wireless Controller$/,"");m=$0} /^ +state:/{s=" ("$2")"} /^ +percentage:/{p=$2} /^$/{if(m!=""&&p!="")print m": "p s;m=""}'); notify-send -e -a Battery Battery "${b:-No battery devices connected}" ;;
esac'''


# Hyprland's colours follow Noctalia's palette: rewrite the scheme file the
# Hyprland config reads (window borders, group bars, background), then reload.
[theme.templates.user.hypr-scheme]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/hypr-scheme.lua"
output_path = "$XDG_CONFIG_HOME/hypr/scheme/current.lua"
post_hook = "hyprctl reload"

# The app colour files caelestia used to write (now frozen) are rewritten in
# place from Noctalia's palette, so each app keeps its existing theme selection.
# One owner per file: the built-in gtk/qt templates are off (builtin_ids = [])
# because they also edit gtk.css, gsettings and kdeglobals.

# Spotify: caelestia's spicetify scheme; `spicetify watch -s` also re-patches on
# change, the hook makes it immediate. -n = no restart, refresh = CSS only.
[theme.templates.user.spicetify]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/spicetify.ini"
output_path = "$XDG_CONFIG_HOME/spicetify/Themes/caelestia/color.ini"
post_hook = "spicetify -q -n refresh"

# GTK 3 and 4: caelestia's gtk.css (libadwaita colour names) with its imports
# of thunar.css (ours) and colors.css (kde-gtk-config's) kept.
[theme.templates.user.gtk]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/gtk.css"
output_path = [
  "$XDG_CONFIG_HOME/gtk-3.0/gtk.css",
  "$XDG_CONFIG_HOME/gtk-4.0/gtk.css",
]

# Thunar: caelestia's rounded-pane look, pulled in by gtk.css above.
[theme.templates.user.thunar]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/thunar.css"
output_path = [
  "$XDG_CONFIG_HOME/gtk-3.0/thunar.css",
  "$XDG_CONFIG_HOME/gtk-4.0/thunar.css",
]

# Qt (qtengine): the KDE colour scheme qtengine/config.json points at. Only the
# file; no post_action, so kdeglobals is not touched.
[theme.templates.user.qtengine]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/qtengine.colors"
output_path = "$XDG_CONFIG_HOME/qtengine/caelestia.colors"

# btop: the theme btop.conf selects. SIGUSR2 makes btop re-read its config and
# theme (btop.cpp: Global::reload_conf).
[theme.templates.user.btop]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/btop.theme"
output_path = "$XDG_CONFIG_HOME/btop/themes/caelestia.theme"
post_hook = "pkill -USR2 -x btop || true"

# Login screen (linux/sddm): its colours go to the synced assets folder, which
# the noctalia-card theme reads; the hook copies the wallpaper the palette came
# from as its still. chmod: the greeter runs as user sddm and must read the
# file, whatever mode it was first created with. Until /var/lib/sddm-assets
# exists, Noctalia logs "failed to open template output" and skips the hook.
[theme.templates.user.sddm]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/sddm-theme.conf"
output_path = "/var/lib/sddm-assets/colours.conf"
post_hook = "chmod 644 /var/lib/sddm-assets/colours.conf && install -m 644 '{{ image }}' /var/lib/sddm-assets/background"

# Equibop: a second theme file next to caelestia's, off until chosen in
# Equibop > Settings > Themes. Noctalia community "Midnight" template.
[theme.templates.user.equibop]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/equibop.theme.css"
output_path = "$XDG_CONFIG_HOME/equibop/themes/noctalia.theme.css"

[widget.clock]
format = "{:%a %b %-d · %-I:%M %p}"      # short date, 12-hour time: Thu Oct 8 · 3:42 PM
tooltip_format = "{:%A, %B %-d, %Y}"      # hover: Thursday, October 8, 2026
