# Off: Noctalia's own wallpaper would cover the live wallpapers
# (linux-wallpaperengine). The wallpaper path stays set, for the colours.
[wallpaper]
enabled = false

# Colours from the wallpaper. The scheme is only the first-run default:
# Noctalia's settings window saves scheme changes in
# ~/.local/state/noctalia/settings.toml, which wins over this file.
[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

# Lock after 1 h, screens off after 1.5 h, lock and suspend after 4 h. Suspend,
# not hibernate: the only swap is zram. Idle inhibitors (browsers and mpv
# during video) pause the timers. Audio alone does not.
[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
timeout = 3600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 5400
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 14400
action = "lock_and_suspend"
enabled = true

# Weather. Name the place in full: a bare city name can match another town.
# Coordinates work, but the UI then shows the numbers as the place name.
[location]
auto_locate = false
address = "Ottawa, Ontario, Canada"

# Night light. Lower is warmer. Don't set force = true: when the config forces
# it, a left click on the control centre button can't leave Always On. Use a
# right click for Always On instead.
[nightlight]
enabled = true
temperature_night = 5800

# Session menu: the default five, but log out runs `uwsm stop`. Don't switch it
# back: Noctalia's own log out exits Hyprland directly, and that has frozen the
# SDDM login screen.
[[shell.session.actions]]
action = "lock"

[[shell.session.actions]]
action = "logout"
command = "uwsm stop"

[[shell.session.actions]]
action = "lock_and_suspend"

[[shell.session.actions]]
action = "reboot"

[[shell.session.actions]]
action = "shutdown"

[shell]
font_family = "JetBrainsMono Nerd Font"
# 12-hour time and a written-out date wherever Noctalia shows them without
# their own setting: control centre, calendar, lock screen.
time_format = "{:%-I:%M %p}"
date_format = "%A, %B %-d, %Y"

# HyDE-style: an invisible bar with separate rounded islands on it.
[bar.default]
margin_edge = 4              # 4 px from the screen top, the same as every gap
margin_ends = 0              # with padding 4, islands align with the windows' 4 px edge
concave_edge_corners = false # those only work on a bar attached to the edge
background_opacity = 0.0     # the bar itself is invisible; only the islands show
compositor_blur = false
shadow = false
thickness = 24               # = island height: no hidden space above or below the islands
padding = 4
widget_spacing = 16          # between islands: 2x the gap inside one
font_weight = 700
font_scale = 0.75             # Noctalia's bar text is 14 px; 0.75 gives ~10.5 px, HyDE's 10 px bold
capsule = true               # every widget and group sits in its own island
capsule_fill = "surface"
capsule_opacity = 0.8        # HyDE: islands slightly see-through; Hyprland blurs behind them
capsule_thickness = 1.0      # islands fill the bar, so screen→island = island→window = 4 px
capsule_padding = 8          # radius left automatic: a full pill
start = ["group:stats", "roynul/workspace-pills:pills", "submap"]
center = ["workspace-apps"]
# Left = information, middle = apps, right = controls.
end = ["media", "group:signal", "updates", "tray", "clock", "group:system", "session"]

[[bar.default.capsule_group]]
id = "stats"                 # machine state, text only
members = ["cpu", "ram", "cputemp", "gputemp", "coolant"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[[bar.default.capsule_group]]
id = "signal"                # is it working: online, sound
members = ["network", "volume"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[[bar.default.capsule_group]]
id = "system"                # how the PC behaves and is set up; power stays alone at the edge
members = ["caffeine", "notifications", "wallpaper", "control-center"]
padding = 8                  # same end padding as single islands (group default is 6)
opacity = 0.8                # match the single islands
widget_spacing = 8

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
label_min_width = 26         # room for "100%", so the bar doesn't shift

[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"
label_min_width = 46

[widget.cputemp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"
label_min_width = 28

[widget.gputemp]
type = "sysmon"
stat = "gpu_temp"
visualization = "none"
label_min_width = 28

# The H100i's coolant temperature (plugins/coolant): monotone, amber and red
# from the pump lighting's points on.
[widget.coolant]
type = "roynul/coolant:coolant"

# The community plugin k4n4t4/hypr-submap: the active Hyprland submap, hidden
# in the default one.
[widget.submap]
type = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true
glyph = "arrows-move"

# The local copy of the community plugin yuuto/arch-updater, with its panel
# floating (see SETUP.md, Update widget).
[widget.updates]
type = "roynul/arch-updater:widget"

# Check for updates every 4 hours (the plugin's default, 0, only checks on click).
[plugin_settings."roynul/arch-updater"]
auto_check_hours = 4

# Media island: "Title - Artist", album art larger than the default 16 px. No
# minimum width, so it fits short titles. Long titles stop at 240 px and scroll.
[widget.media]
title_scroll = "always"
art_size = 20
min_length = 0
max_length = 240
hide_when_no_media = true

# Control centre sidebar with icons and names, also when it opens on a tab.
[control_center]
sidebar = "full"
sidebar_section = "full"

# The default six buttons, with Share Cursor (plugins/share-cursor) in place
# of Wi-Fi. The control centre shows at most six.
[[control_center.shortcuts]]
type = "roynul/share-cursor:share-cursor"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[widget.network]
show_label = false           # icon only, no "enp5s0"

# The built-in workspaces widget. The bar shows roynul/workspace-pills instead,
# which copies this look. Keep these values for a switch back.
# Bare numbers, the active one a wider filled pill. Inactive pills are
# transparent, so only their numbers show.
[widget.workspaces]
style = "regular"
label_source = "id"
hide_when_empty = true       # only workspaces with windows (plus the active one)
focused_color = "primary"
occupied_color = "#00000000"  # transparent: the number sits straight on the see-through island
empty_color = "#00000000"
active_pill_size = 2.2
font_scale = 1.3             # numbers start at 11 px and the bar scale (0.75) applies too: 11 × 0.75 × 1.3 ≈ 10.7 px
inactive_pill_size = 1.0
pill_scale = 1.0

# The app icons on this monitor's current workspace (plugins/workspace-apps).
[widget.workspace-apps]
type = "roynul/workspace-apps:icons"

# Screenshots open in the editor first (see SETUP.md, Config). In the region
# overlay, the copy and save keys skip the editor.
[shell.screenshot]
annotate = true
skip_annotate_on_copy_save = true
save_to_file = false
directory = "~/Pictures/Screenshots"   # Save puts them here, not loose in ~/Pictures
copy_to_clipboard = true

# Float the panels: an attached panel shares the bar's background, which is
# invisible here.
[shell.panel]
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"
# Open each panel under the island that was clicked, not at the bar's centre.
open_near_click_control_center = true
open_near_click_wallpaper = true
open_near_click_session = true
open_near_click_clipboard = true

# No built-in templates: the built-in kitty, GTK and Qt templates also edit
# kitty.conf, gtk.css, gsettings and kdeglobals. Copies in templates/ write
# only their own files.
[theme.templates]
builtin_ids = []

[theme.templates.user.kitty]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/kitty.conf"
output_path = "$XDG_CONFIG_HOME/kitty/themes/noctalia.conf"
post_hook = "pkill -USR1 -x kitty || true"

# Launcher actions: type /cmd to list them. Each line is
# title<TAB>description. `exec` gets the chosen line as {selection}.
[shell.launcher.dmenu.entry.actions]
label = "Actions"
prefix = "cmd"
glyph = "bolt"
global = true
command = """printf '%s\t%s\n' \
  'Restart audio' 'Fix sound after the headset reconnects (PipeWire, EQ)' \
  'Restart shell' 'Restart Noctalia (fixes bar and panel glitches)' \
  'Reload Hyprland' 'Re-read the Hyprland config; puts workspaces back on their monitors' \
  'Restart wallpapers' 'Restart the live wallpapers' \
  'Battery' 'Show the charge of wireless devices (mice, controllers)'"""
exec = '''case "{selection}" in
  "Restart audio"*) systemctl --user restart pipewire pipewire-pulse wireplumber filter-chain ;;
  "Restart shell"*) pkill -x noctalia; sleep .5; uwsm app -- noctalia ;;
  "Reload Hyprland"*) hyprctl reload ;;
  "Restart wallpapers"*) "$HOME/.local/bin/live-wallpaper" ;;
  "Battery"*) b=$(upower -d | awk '/^Device:/{m="";p="";s=""} /^ +model:/{sub(/^ +model: +/,"");sub(/^(Logitech|Sony Interactive Entertainment) /,"");sub(/ Wireless Controller$/,"");m=$0} /^ +state:/{s=" ("$2")"} /^ +percentage:/{p=$2} /^$/{if(m!=""&&p!="")print m": "p s;m=""}'); notify-send -e -a Battery Battery "${b:-No battery devices connected}" ;;
esac'''


# Hyprland's colours follow Noctalia's palette: rewrite the scheme file the
# Hyprland config reads (window borders, group bars, background), then reload.
[theme.templates.user.hypr-scheme]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/hypr-scheme.lua"
output_path = "$XDG_CONFIG_HOME/hypr/scheme/current.lua"
post_hook = "hyprctl reload"

# App colour files from Noctalia's palette. Each app selects "noctalia".

# Spotify. The hook patches only the CSS (refresh) and skips the restart (-n).
[theme.templates.user.spicetify]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/spicetify.ini"
output_path = "$XDG_CONFIG_HOME/spicetify/Themes/noctalia/color.ini"
post_hook = "spicetify -q -n refresh"

# GTK 3 and 4, in libadwaita colour names. It imports kde-gtk-config's
# colors.css.
[theme.templates.user.gtk]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/gtk.css"
output_path = [
  "$XDG_CONFIG_HOME/gtk-3.0/gtk.css",
  "$XDG_CONFIG_HOME/gtk-4.0/gtk.css",
]

# Qt (qtengine): the KDE colour scheme that qtengine/config.json points at. No
# post_action, so kdeglobals stays untouched.
[theme.templates.user.qtengine]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/qtengine.colors"
output_path = "$XDG_CONFIG_HOME/qtengine/noctalia.colors"

# btop: the theme btop.conf selects. SIGUSR2 makes btop read its config and
# theme again.
[theme.templates.user.btop]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/btop.theme"
output_path = "$XDG_CONFIG_HOME/btop/themes/noctalia.theme"
post_hook = "pkill -USR2 -x btop || true"

# Login screen (linux/sddm): the colours go to the assets folder that the
# noctalia-card theme reads. The hook copies the wallpaper the palette came
# from as the login still. chmod: the greeter runs as user sddm and must read
# the file, whatever mode it was created with. Until /var/lib/sddm-assets
# exists, Noctalia logs "failed to open template output" and skips the hook.
[theme.templates.user.sddm]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/sddm-theme.conf"
output_path = "/var/lib/sddm-assets/colours.conf"
post_hook = "chmod 644 /var/lib/sddm-assets/colours.conf && install -m 644 '{{ image }}' /var/lib/sddm-assets/background"

# Equibop: Noctalia's community "Midnight" theme, off until you choose it in
# Equibop's Settings, Themes.
[theme.templates.user.equibop]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/equibop.theme.css"
output_path = "$XDG_CONFIG_HOME/equibop/themes/noctalia.theme.css"

[widget.clock]
format = "{:%a %b %-d · %-I:%M %p}"      # short date, 12-hour time: Thu Oct 8 · 3:42 PM
tooltip_format = "{:%A, %B %-d, %Y}"      # hover: Thursday, October 8, 2026

# RAM lighting (~/.local/bin/case-lights): the accent colour as plain hex. The
# script raises its saturation, because LEDs show the pastel as near-white.
[theme.templates.user.rgb-accent]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/rgb-accent.txt"
output_path = "$XDG_CONFIG_HOME/case-lights/accent"

# A 5800X sits at 60-70 C on the desktop, so the defaults (60 / 85) tinted the
# CPU temperature all day. AMD's limit for this CPU is 90 C.
[system.monitor]
cpu_temp_activity_threshold = 75
cpu_temp_critical_threshold = 88
