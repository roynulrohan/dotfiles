# One fixed buffer size (quantum), so apps can't change it. Every change
# interrupts playback for a moment: caelestia's dashboard asks for 512 while
# its beat tracker or visualiser runs, and the graph otherwise ran at 2048, so
# opening the dashboard or switching tabs made music stutter. 1024 at 48 kHz is
# about 21 ms. 512 also works (about 11 ms, and caelestia reads at most 512
# samples per buffer, so it misses part of the audio at 1024).
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
}
