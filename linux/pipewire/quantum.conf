# One fixed buffer size (quantum), so apps can't change it. Every change
# interrupts playback for a moment: caelestia's dashboard asks for 512 while
# its beat tracker or visualiser runs, and the graph otherwise ran at 2048, so
# opening the dashboard or switching tabs made music stutter. 512 at 48 kHz is
# about 11 ms, and caelestia reads at most 512 samples per buffer. 1024 also
# works (about 21 ms) if 512 ever crackles under load.
context.properties = {
    default.clock.quantum     = 512
    default.clock.min-quantum = 512
    default.clock.max-quantum = 512
}
