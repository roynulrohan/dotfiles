# One fixed buffer size (quantum), so apps can't change it. Every change
# interrupts playback for a moment, so an app that asks for a smaller buffer
# (an audio visualiser, for example) makes music stutter whenever it opens.
# 1024 at 48 kHz is about 21 ms.
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
}
