# EQ for the Logitech G432, run by filter-chain.service. A WirePlumber smart
# filter: it sits in front of the headset only, and the headset stays the
# default output. Why these values: SETUP.md.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "G432 EQ"
            media.name       = "G432 EQ"
            filter.graph = {
                nodes = [
                    {
                        type   = builtin
                        name   = eq
                        label  = param_eq
                        config = {
                            filters = [
                                # Preamp: a high shelf at 0 Hz is a flat gain.
                                { type = bq_highshelf freq = 0     gain = -6.0 }
                                # G HUB "Bass Music/FPS" sliders 32 Hz..16 kHz:
                                # +12 +10 +8 -3 -2 +4 +4 +5 +8 +12, fitted so
                                # the summed bands land on those values.
                                { type = bq_peaking   freq = 32    gain = 10.5 q = 1.41 }
                                { type = bq_peaking   freq = 64    gain = 6.6  q = 1.41 }
                                { type = bq_peaking   freq = 125   gain = 7.1  q = 1.41 }
                                { type = bq_peaking   freq = 250   gain = -4.5 q = 1.41 }
                                { type = bq_peaking   freq = 500   gain = -2.4 q = 1.41 }
                                { type = bq_peaking   freq = 1000  gain = 3.9  q = 1.41 }
                                { type = bq_peaking   freq = 2000  gain = 2.6  q = 1.41 }
                                { type = bq_peaking   freq = 4000  gain = 3.2  q = 1.41 }
                                { type = bq_peaking   freq = 8000  gain = 6.5  q = 1.41 }
                                { type = bq_peaking   freq = 16000 gain = 11.5 q = 1.41 }
                            ]
                        }
                    }
                ]
                inputs  = [ "eq:In 1" "eq:In 2" ]
                outputs = [ "eq:Out 1" "eq:Out 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name           = "effect_input.g432_eq"
                media.class         = Audio/Sink
                filter.smart        = true
                filter.smart.name   = "g432-eq"
                filter.smart.target = {
                    node.name = "alsa_output.usb-Logitech_G432_Gaming_Headset_000000000000-00.analog-stereo"
                }
            }
            playback.props = {
                node.name    = "effect_output.g432_eq"
                node.passive = true
            }
        }
    }
]
