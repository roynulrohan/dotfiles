# macOS overrides for shared/kitty/kitty.conf, loaded by its
# `globinclude ${KITTY_OS}.conf` line.

# macOS has no abstract sockets: unix:@kitty makes kitty log "Invalid listen_on"
# and start without remote control. A path works; kitty appends -PID. AeroSpace's
# ctrl-alt-t (mac/wm/aerospace) connects to /tmp/kitty-<pid>, so keep this path.
listen_on unix:/tmp/kitty
